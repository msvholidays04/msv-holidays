<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSV Holidays — Tamil Nadu Tours & Cabs</title>
<meta name="description" content="MSV Holidays, Madurai. Tamil Nadu tour packages, cab rentals and custom trips.">
<meta name="theme-color" content="#eaf1ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141a3a; --ink2:#4a5280; --line:rgba(255,255,255,.65);
  --brand:#2a3b9a; --brand2:#6a7dff; --accent:#ff7a59; --ok:#16a36a; --bad:#e5484d; --warn:#e9a30c;
  --r:26px; --blur:18px;
  --ease:cubic-bezier(.22,.8,.22,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#eef3ff;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:84px}
@media(min-width:900px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.02em}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* ---------- BACKGROUND (transform-only animation = smooth) ---------- */
.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 10% 0%,#c9dcff 0,transparent 70%),
  radial-gradient(50% 45% at 95% 10%,#ffd3e0 0,transparent 70%),
  radial-gradient(60% 50% at 50% 100%,#c8f1ff 0,transparent 70%),
  linear-gradient(180deg,#eaf2ff,#f6f0ff 55%,#fff4f6)}
.orb{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;will-change:transform;opacity:.75}
.o1{width:520px;height:520px;left:-140px;top:-120px;background:radial-gradient(circle at 35% 35%,#a9c4ff,#8f8bff 55%,transparent 70%);animation:fl 22s ease-in-out infinite}
.o2{width:460px;height:460px;right:-120px;top:25vh;background:radial-gradient(circle at 40% 40%,#ffbfd6,#ffc9a6 55%,transparent 70%);animation:fl 26s ease-in-out -6s infinite}
.o3{width:560px;height:560px;left:25vw;bottom:-260px;background:radial-gradient(circle at 40% 40%,#a8f1ff,#b9c4ff 55%,transparent 70%);animation:fl 30s ease-in-out -12s infinite}
@keyframes fl{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(40px,-34px,0)}}

/* ---------- LIQUID GLASS ---------- */
.glass{
  position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.52),rgba(255,255,255,.2));
  backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.04);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.04);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r);
  box-shadow:0 10px 34px rgba(36,52,130,.10),0 1px 3px rgba(36,52,130,.06),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 22px rgba(255,255,255,.18);
}
.glass::before{ /* specular rim */
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,0) 40%,rgba(255,255,255,.25) 70%,rgba(255,255,255,.8));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass.dark{background:linear-gradient(145deg,rgba(24,34,92,.62),rgba(24,34,92,.34));color:#fff;border-color:rgba(255,255,255,.2)}
.glass.pill{border-radius:999px}
.glass.hover{transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.glass.hover:hover{transform:translate3d(0,-4px,0);box-shadow:0 18px 44px rgba(36,52,130,.16),inset 0 1.5px 0 #fff}

/* ---------- BUTTONS / FIELDS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#243489,#4d63e8);color:#fff;box-shadow:0 8px 22px rgba(42,59,154,.32),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(42,59,154,.4)}
.btn.light{background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.06),inset 0 1px 0 #fff}
.btn.light:hover{background:#fff;transform:translateY(-1px)}
.btn.wa{background:linear-gradient(135deg,#1fa855,#2fd073);color:#fff;box-shadow:0 8px 22px rgba(31,168,85,.3)}
.btn.danger{background:rgba(229,72,77,.12);color:var(--bad)}
.btn.ok{background:rgba(22,163,106,.14);color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.in{width:100%;padding:13px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.62);box-shadow:inset 0 1px 3px rgba(36,52,130,.08);outline:0;transition:box-shadow .25s,background .25s;font-size:15px}
.in:focus{background:#fff;box-shadow:0 0 0 3px rgba(106,125,255,.35),inset 0 1px 3px rgba(36,52,130,.05)}
textarea.in{min-height:96px;resize:vertical}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.85)}
.chip{padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);transition:all .3s var(--ease)}
.chip.on{background:linear-gradient(135deg,#243489,#4d63e8);color:#fff;border-color:transparent}
.muted{color:var(--ink2)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
h1.serif{font-size:clamp(44px,8vw,86px);line-height:.95}
h2.serif{font-size:clamp(34px,5vw,54px);line-height:1}
section{padding:46px 0;content-visibility:auto;contain-intrinsic-size:auto 600px}

/* ---------- NAV ---------- */
header.nav{position:fixed;top:12px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.nav .bar{pointer-events:auto;width:100%;max-width:1120px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:18px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#243489,#6a7dff);color:#fff;font-style:normal;box-shadow:0 4px 12px rgba(42,59,154,.4)}
.logo small{display:block;font-size:9.5px;letter-spacing:.2em;opacity:.55;margin-top:-2px}
.links{display:none;margin-left:auto;gap:4px}
.links a{padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;transition:background .3s}
.links a:hover{background:rgba(255,255,255,.7)}
.links a.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.nav .cta{margin-left:auto}
@media(min-width:900px){.links{display:flex}.nav .cta{margin-left:0}}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:space-around;padding:8px;border-radius:30px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:22px;font-size:10.5px;font-weight:700;color:var(--ink2);transition:all .3s var(--ease)}
.tabbar a span{font-size:19px;line-height:1}
.tabbar a.on{background:#fff;color:var(--brand);box-shadow:0 3px 10px rgba(0,0,0,.08)}
@media(min-width:900px){.tabbar{display:none}}

/* ---------- VIEW ---------- */
main{padding-top:92px;min-height:80vh}
.view{animation:vin .55s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- HERO ---------- */
.hero{padding:26px 0 10px}
.hero p.lead{font-size:clamp(16px,2vw,19px);max-width:52ch;margin-top:18px;color:var(--ink2)}
.search{margin-top:30px;padding:10px;display:grid;gap:8px;grid-template-columns:1fr;border-radius:30px}
@media(min-width:760px){.search{grid-template-columns:1.3fr 1fr .8fr auto;border-radius:999px;padding:10px 10px 10px 14px}}
.search .field{padding:4px 10px}
.search .in{background:transparent;box-shadow:none;border:0;padding:4px 0;font-weight:600}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px}
.stats b{font-size:28px;display:block;line-height:1}
.stats small{font-size:12px;color:var(--ink2)}
.heroart{margin-top:30px;min-height:300px;border-radius:36px;overflow:hidden;position:relative;display:grid;place-items:center}
@media(min-width:900px){.hero .split{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}.heroart{margin-top:0;min-height:460px}}
.float{position:absolute;padding:12px 16px;font-size:13px;font-weight:700;animation:bob 7s ease-in-out infinite;will-change:transform}
@keyframes bob{50%{transform:translate3d(0,-10px,0)}}

/* ---------- CARDS ---------- */
.pcard{display:flex;flex-direction:column;padding:10px;cursor:pointer;height:100%}
.art{position:relative;height:210px;border-radius:calc(var(--r) - 8px);overflow:hidden;display:grid;place-items:center;font-size:64px;background-size:cover;background-position:center}
.art .badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:0}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 45%,rgba(0,0,0,.18))}
.art>*{position:relative;z-index:1}
.art .tag{position:relative;z-index:2;font-size:10.5px}
.pbody{padding:16px 10px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{font-size:18px;line-height:1.25;letter-spacing:-.01em}
.pfoot{margin-top:auto;display:flex;align-items:end;justify-content:space-between;gap:10px;padding-top:10px}
.price{font-size:22px;font-weight:800;letter-spacing:-.02em}
.price small{font-size:12px;font-weight:600;color:var(--ink2)}
.dest{padding:0;overflow:hidden;cursor:pointer;min-height:180px}
.dest .art{height:100%;min-height:180px;border-radius:inherit;font-size:54px;place-items:center}
.dest .cap{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:10px 14px;border-radius:18px;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.icon{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,0,0,.05)}
.stars{color:#f5a623;letter-spacing:2px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}

/* ---------- FORM ---------- */
.form{padding:22px}
@media(min-width:700px){.form{padding:32px}}
.fgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.full{grid-column:1/-1}
.seg{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.5);flex-wrap:wrap}
.seg label{flex:1;min-width:110px;text-align:center;padding:10px 12px;border-radius:999px;font-weight:700;font-size:13.5px;cursor:pointer;transition:all .3s var(--ease)}
.seg input{display:none}
.seg input:checked+span{display:block;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08);color:var(--brand);border-radius:999px;margin:-10px -12px;padding:10px 12px}
.vgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.vopt input{display:none}
.vopt span{display:block;padding:12px;border-radius:18px;background:rgba(255,255,255,.55);border:1.5px solid transparent;text-align:center;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s var(--ease)}
.vopt span small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
.vopt input:checked+span{background:#fff;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(106,125,255,.2)}
.err{color:var(--bad);font-size:12px;font-weight:600;min-height:0}
.in.bad{box-shadow:0 0 0 2px var(--bad)}

/* ---------- DETAIL ---------- */
.day{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed rgba(20,26,58,.12)}
.day:last-child{border:0}
.day b.n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#243489,#6a7dff);color:#fff;font-size:12px}
ul.tick{list-style:none;display:grid;gap:8px}
ul.tick li{padding-left:26px;position:relative;font-size:14.5px}
ul.tick li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800}
ul.tick.x li::before{content:'✕';color:var(--bad)}
details{padding:16px 20px;border-radius:20px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8)}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:'+';font-size:20px;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:10px;color:var(--ink2);font-size:14.5px}
.sticky{position:sticky;top:96px}
.two{display:grid;gap:22px}
@media(min-width:960px){.two{grid-template-columns:1.6fr 1fr;align-items:start}}

/* ---------- FOOTER / FLOAT ---------- */
footer{padding:50px 0 120px}
@media(min-width:900px){footer{padding-bottom:50px}}
.wafab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:49;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#1fa855,#2fd073);color:#fff;box-shadow:0 10px 26px rgba(31,168,85,.45);transition:transform .3s var(--ease)}
.wafab:hover{transform:scale(1.08)}
@media(min-width:900px){.wafab{bottom:24px;right:24px}}
.toast{position:fixed;left:50%;top:84px;transform:translate3d(-50%,-20px,0);opacity:0;z-index:99;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;transition:all .45s var(--ease);pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate3d(-50%,0,0)}

/* ---------- ADMIN ---------- */
.adm{display:grid;gap:18px}
@media(min-width:900px){.adm{grid-template-columns:220px 1fr;align-items:start}}
.side{padding:12px;display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap}
@media(min-width:900px){.side{flex-direction:column;position:sticky;top:96px;overflow:visible}}
.side button{padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;text-align:left;white-space:nowrap;transition:all .3s var(--ease);color:var(--ink2)}
.side button.on{background:#fff;color:var(--brand);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.stat{padding:20px}
.stat b{font-size:34px;display:block;letter-spacing:-.03em;line-height:1.1}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:4px 14px}
.tbl td{padding:12px 14px;background:rgba(255,255,255,.55);font-size:14px;vertical-align:middle}
.tbl td:first-child{border-radius:16px 0 0 16px}.tbl td:last-child{border-radius:0 16px 16px 0}
.tw{overflow-x:auto}
.st{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.st.new{background:#dfe6ff;color:#2a3b9a}.st.contacted{background:#fff0cc;color:#a56d00}.st.accepted{background:#d5f5e6;color:#0f7a4e}.st.rejected{background:#fde0e1;color:#b3262c}.st.completed{background:#e5e3f7;color:#4a3fa0}
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(20,26,58,.35);padding:0}
.modal.open{display:flex;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal .sheet{width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:24px;border-radius:30px 30px 0 0;background:rgba(246,248,255,.92);animation:up .5s var(--ease) both;overscroll-behavior:contain}
@media(min-width:760px){.modal{align-items:center;padding:20px}.modal .sheet{border-radius:30px}}
@keyframes up{from{transform:translate3d(0,40px,0);opacity:0}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink2);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--ink2)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
@media(max-width:700px){:root{--blur:14px}.orb{opacity:.55}}
</style>
</head>
<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<header class="nav"><div class="bar glass pill">
  <a href="#/" class="logo"><i>M</i><div>MSV HOLIDAYS<small>MADURAI • TAMIL NADU</small></div></a>
  <nav class="links" id="links">
    <a href="#/" data-r="home">Home</a><a href="#/packages" data-r="packages">Packages</a><a href="#/fleet" data-r="fleet">Cabs</a><a href="#/reviews" data-r="reviews">Reviews</a><a href="#/contact" data-r="contact">Contact</a>
  </nav>
  <a href="#/enquiry" class="btn primary sm cta">Plan my trip →</a>
</div></header>

<main id="app"></main>

<nav class="tabbar glass" id="tabbar">
  <a href="#/" data-r="home"><span>🏠</span>Home</a>
  <a href="#/packages" data-r="packages"><span>🧭</span>Packages</a>
  <a href="#/enquiry" data-r="enquiry"><span>✍️</span>Enquire</a>
  <a href="#/reviews" data-r="reviews"><span>⭐</span>Reviews</a>
  <a href="#/contact" data-r="contact"><span>📞</span>Contact</a>
</nav>
<a class="wafab" id="wafab" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
<div class="toast glass dark pill" id="toast"></div>
<div class="modal" id="modal"><div class="sheet glass" data-lenis-prevent id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem('msv_'+k);return v?JSON.parse(v):(k in mem?mem[k]:d)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem('msv_'+k,JSON.stringify(v))}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return d||'—'}};
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);

/* ================= seed data (DEMO) ================= */
const VEHICLES=[
  {id:'dzire',name:'Sedan',ex:'Dzire / Etios',seats:4,rate:12,icon:'🚗'},
  {id:'ertiga',name:'Ertiga',ex:'MPV • AC',seats:6,rate:15,icon:'🚙'},
  {id:'innova',name:'Innova Crysta',ex:'Premium SUV',seats:7,rate:19,icon:'🚐'},
  {id:'tempo',name:'Tempo Traveller',ex:'12 / 17 seats',seats:12,rate:26,icon:'🚌'},
  {id:'bus',name:'Mini Bus',ex:'25 seats',seats:25,rate:38,icon:'🚍'}
];

/* ================= UI utils ================= */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(html){const m=$('#modal');$('#sheet').innerHTML=html;m.classList.add('open');document.documentElement.style.overflow='hidden';if(lenis)lenis.stop()}
function closeModal(){$('#modal').classList.remove('open');document.documentElement.style.overflow='';if(lenis)lenis.start()}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function art(p,cls){
  const bg=p.img?`background-image:url('${esc(p.img)}')`:`background:linear-gradient(140deg,hsl(${p.hue||220} 80% 78%),hsl(${((p.hue||220)+50)%360} 85% 66%))`;
  return `<div class="art ${cls||''}" style="${bg}">${p.img?'':`<span style="filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))">${p.emoji||'🧳'}</span>`}`;
}
const stars=n=>'<span class="stars">'+'★'.repeat(Math.round(n))+'<span style="opacity:.25">'+'★'.repeat(5-Math.round(n))+'</span></span>';
const waLink=(txt)=>{const s=DB.set();return `https://wa.me/${String(s.wa).replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`};

function pkgCard(p){
  return `<article class="glass hover pcard rv" data-go="#/package/${p.id}">
    ${art(p)}<div class="badges"><span class="tag">${esc(p.category)}</span>${p.featured?'<span class="tag" style="background:#243489;color:#fff">Best seller</span>':''}</div></div>
    <div class="pbody"><div class="muted" style="font-size:12.5px;font-weight:600">📍 ${esc(p.dest)} • ${p.days}D / ${Math.max(p.days-1,0)}N</div>
    <h3>${esc(p.title)}</h3><div style="font-size:13px">${stars(p.rating||4.5)} <span class="muted">${esc(p.rating||'')}</span></div>
    <div class="pfoot"><div class="price">${inr(p.price)}<small> / person</small></div><span class="btn light sm">View →</span></div></div></article>`;
}
function reviewCard(r){
  return `<article class="glass pcard rv" style="cursor:default;padding:22px;gap:10px"><div>${stars(r.rating)}</div>
  <p style="font-size:15px">“${esc(r.text)}”</p><div style="margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:13px"><b>${esc(r.name)}</b><span class="muted">${esc(r.trip)}</span></div></article>`;
}

/* ================= ROUTER ================= */
let lenis=null,io=null,curKey='';
function parse(){
  const h=location.hash.replace(/^#/,'')||'/';const [path,qs]=h.split('?');
  const q={};new URLSearchParams(qs||'').forEach((v,k)=>q[k]=v);
  const seg=path.split('/').filter(Boolean);return {seg,q};
}
function render(){
  const {seg,q}=parse();const name=seg[0]||'home';let html;
  if(name==='home')html=V.home();
  else if(name==='packages')html=V.packages(q);
  else if(name==='package')html=V.package(seg[1]);
  else if(name==='fleet')html=V.fleet();
  else if(name==='reviews')html=V.reviews();
  else if(name==='contact')html=V.contact();
  else if(name==='enquiry')html=V.enquiry(q);
  else if(name==='done')html=V.done(seg[1]);
  else if(name==='admin')html=V.admin();
  else html=V.home();
  const key=name+(seg[1]||'');
  const same=key===curKey&&name==='packages';
  $('#app').innerHTML=html;
  document.title=(name==='package'?(DB.pk().find(p=>p.id===seg[1])||{}).title+' — ':'')+'MSV Holidays';
  $$('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===(name==='package'?'packages':name)));
  if(!same)toTop();
  curKey=key;
  if(name==='enquiry')syncType();
  observe();
  const s=DB.set();$('#wafab').href=waLink('Hi MSV Holidays, I need help planning a trip.');
}
function toTop(){if(lenis)lenis.scrollTo(0,{immediate:true});else window.scrollTo(0,0)}
function observe(){
  if(io)io.disconnect();
  const els=$$('.rv');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.05});
  els.forEach((e,i)=>{e.style.transitionDelay=Math.min(i%6,5)*60+'ms';io.observe(e)});
}
function syncType(){
  const f=$('#eqForm');if(!f)return;const t=f.querySelector('[name=type]:checked').value;
  $$('[data-show]',f).forEach(el=>el.style.display=el.dataset.show.split(' ').includes(t)?'':'none');
}
window.addEventListener('hashchange',render);

/* ================= EVENTS (delegated) ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-cat],[data-tab],[data-f],[data-act],[data-eq-view],[data-eq-st],[data-eq-del],[data-pk-edit],[data-pk-tog],[data-pk-del],[data-rv-ok],[data-rv-del]');
  if(!t)return;const d=t.dataset;
  if(d.go){location.hash=d.go;return}
  if(d.cat!==undefined&&t.classList.contains('chip')&&$('#flt')){const {q}=parse();q.cat=d.cat;setQ(q);return}
  if(d.tab){adm.tab=d.tab;refreshAdm();return}
  if(d.f){adm.f=d.f;refreshAdm();return}
  if(d.act==='close'){closeModal();return}
  if(d.act==='logout'){setAdmin(false);render();return}
  if(d.act==='csv'){csv();return}
  if(d.act==='pk-new'){pkModal();return}
  if(d.act==='reset'){if(confirm('Reset all demo data?')){['packages','reviews','enq','settings'].forEach(k=>store.set(k,{}));store.set('packages',SEED_PK);store.set('reviews',SEED_RV);store.set('enq',SEED_EQ);store.set('settings',SEED_SET);toast('Demo data reset');refreshAdm()}return}
  if(d.eqView){eqModal(d.eqView);return}
  if(d.eqSt){
    const [id,st]=d.eqSt.split('|');const l=DB.eq();const x=l.find(y=>y.id===id);if(!x)return;
    x.status=st;const n=$('#eqNote'),q=$('#eqQuote');if(n)x.note=n.value;if(q)x.quote=q.value;
    DB.saveEq(l);toast('Marked '+st);eqModal(id);refreshAdm();return}
  if(d.eqDel){if(confirm('Delete this enquiry?')){DB.saveEq(DB.eq().filter(x=>x.id!==d.eqDel));closeModal();refreshAdm();toast('Deleted')}return}
  if(d.pkEdit){pkModal(d.pkEdit);return}
  if(d.pkTog){const l=DB.pk();const p=l.find(x=>x.id===d.pkTog);p.active=!p.active;DB.savePk(l);refreshAdm();return}
  if(d.pkDel){if(confirm('Delete this package?')){DB.savePk(DB.pk().filter(x=>x.id!==d.pkDel));refreshAdm();toast('Package deleted')}return}
  if(d.rvOk){const l=DB.rv();l.find(x=>x.id===d.rvOk).ok=true;DB.saveRv(l);refreshAdm();toast('Approved');return}
  if(d.rvDel){DB.saveRv(DB.rv().filter(x=>x.id!==d.rvDel));refreshAdm();return}
});
function setQ(q){const s=new URLSearchParams();Object.keys(q).forEach(k=>q[k]&&s.set(k,q[k]));location.hash='#/packages'+(s.toString()?'?'+s:'')}
document.addEventListener('change',e=>{
  if(e.target.closest('#flt')){const {q}=parse();$$('#flt [name]').forEach(i=>q[i.name]=i.value);setQ(q)}
  if(e.target.name==='type')syncType();
});
let st;document.addEventListener('input',e=>{
  if(e.target.id==='eqSearch'){clearTimeout(st);const v=e.target.value;st=setTimeout(()=>{adm.s=v;refreshAdm();const i=$('#eqSearch');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},220)}
  if(e.target.closest('#flt')&&e.target.name==='s'){clearTimeout(st);st=setTimeout(()=>{const {q}=parse();q.s=e.target.value;setQ(q)},450)}
  e.target.classList&&e.target.classList.remove('bad');
});

document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='qs'){const d=new FormData(f);location.hash=`#/enquiry?${new URLSearchParams({dest:d.get('dest')||'',date:d.get('date')||'',adults:d.get('adults')||2})}`;return}
  if(f.id==='eqForm'){
    const d=Object.fromEntries(new FormData(f));let ok=true;
    const bad=(n,m)=>{const i=f.querySelector(`[name=${n}]`);i.classList.add('bad');const er=i.parentElement.querySelector('.err');if(er)er.textContent=m;if(ok)i.focus({preventScroll:false});ok=false};
    $$('.err',f).forEach(x=>x.textContent='');
    const ph=String(d.phone||'').replace(/\D/g,'').slice(-10);
    if(!d.name||d.name.trim().length<2)bad('name','Enter your name');
    if(!/^[6-9]\d{9}$/.test(ph))bad('phone','Enter a valid 10-digit mobile');
    if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email))bad('email','Check email format');
    if(!d.date)bad('date','Pick a travel date');
    if(d.ret&&d.date&&d.ret<d.date)bad('ret','Return is before travel date');
    if(!ok)return;
    const l=DB.eq();const n=1000+l.length+1+Math.floor(Math.random()*50);let ref='MSV-'+n;while(l.some(x=>x.ref===ref))ref='MSV-'+(++n);
    const p=DB.pk().find(x=>x.id===d.pkg);
    l.push({id:uid(),ref,type:d.type,name:d.name.trim(),phone:ph,email:d.email||'',pkg:d.pkg||'',dest:p?p.dest:'',pickup:d.pickup||'',drop:d.drop||'',date:d.date,ret:d.ret||'',flex:!!d.flex,adults:+d.adults||1,kids:+d.kids||0,vehicle:d.vehicle||'',hotel:d.hotel||'',meal:d.meal||'',budget:d.budget||'',msg:d.msg||'',status:'new',note:'',quote:'',created:new Date().toISOString()});
    DB.saveEq(l);location.hash='#/done/'+ref;return}
  if(f.id==='rvForm'){
    const d=Object.fromEntries(new FormData(f));const l=DB.rv();
    l.unshift({id:uid(),name:d.name.trim(),trip:d.trip||'',rating:+d.rating,text:d.text.trim(),date:today(),ok:false});DB.saveRv(l);f.reset();toast('Thanks! Review sent for approval.');return}
  if(f.id==='loginForm'){
    const d=Object.fromEntries(new FormData(f));
    if(d.u==='admin'&&d.p==='msv@123'){setAdmin(true);render()}else toast('Wrong username or password');return}
  if(f.id==='setForm'){DB.saveSet(Object.fromEntries(new FormData(f)));toast('Settings saved');return}
  if(f.id==='pkForm'){
    const d=Object.fromEntries(new FormData(f));const l=DB.pk();const id=f.dataset.id;
    const obj={title:d.title.trim(),dest:d.dest.trim(),category:d.category,days:Math.max(1,+d.days||1),price:+d.price||0,emoji:d.emoji||'🧳',hue:+d.hue||220,img:(d.img||'').trim(),
      highlights:lines(d.highlights),itinerary:lines(d.itinerary),inc:lines(d.inc),exc:lines(d.exc),featured:!!d.featured,active:!!d.active};
    if(obj.img&&!/^https?:\/\//i.test(obj.img))obj.img='';
    if(id){const p=l.find(x=>x.id===id);Object.assign(p,obj)}else l.unshift(Object.assign({id:uid(),rating:4.5},obj));
    DB.savePk(l);closeModal();refreshAdm();toast('Package saved');return}
});

/* ================= SMOOTH SCROLL ================= */
function initLenis(){
  if(lenis||!window.Lenis||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  try{
    lenis=new Lenis({duration:1.1,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t)),smoothWheel:true,wheelMultiplier:.95,touchMultiplier:1.4,anchors:false});
    const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf);
  }catch(err){lenis=null}
}
window.addEventListener('load',initLenis);
const lt=setInterval(()=>{if(window.Lenis){initLenis();clearInterval(lt)}},300);setTimeout(()=>clearInterval(lt),6000);

/* ================= BOOT ================= */
seed();render();
})();
</script>
